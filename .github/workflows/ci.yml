name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-algovision:
    name: Тесты архива AlgoVision
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/algovision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
