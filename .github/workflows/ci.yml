name: CI и публикация

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты Prep&Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка синтаксиса
        run: for f in $(find src tests -name '*.js'); do node --check "$f"; done
      - name: Автотесты
        run: npm test

  archive:
    name: Тесты архива AlgoVision
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/algovision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Публикация на GitHub Pages
    needs: test
    # Публикуем только из основной ветки репозитория.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собираем папку сайта
        run: |
          mkdir _site
          cp -r index.html styles src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
