<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Prep&amp;Play - подготовка к экзаменам в виде игры</title>
    <meta
      name="description"
      content="Prep&Play - подготовка к экзаменам в виде игры: SAT, IELTS, TOEFL, ЕНТ, ЕГЭ и экзамены других стран СНГ, олимпиадная математика, ежедневная практика по математике и английскому. Разбор каждого задания на русском, казахском и английском."
    />
    <meta name="theme-color" content="#6c4cf5" />
    <meta property="og:title" content="Prep&amp;Play - экзамены как игра" />
    <meta property="og:description" content="SAT, IELTS, TOEFL, ЕНТ, ЕГЭ, олимпиадная математика и ежедневная практика. RU / KZ / EN." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c4cf5'/%3E%3Cpath d='M12.5 9.5v13l10.5-6.5z' fill='%23fff'/%3E%3Ccircle cx='25.5' cy='7.5' r='3.5' fill='%23facc15'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prep&amp;Play" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script>
      // Тема применяется до отрисовки, чтобы страница не мигала другим цветом.
      try {
        var theme = JSON.parse(localStorage.getItem('prepplay:theme'));
        if (theme) document.documentElement.dataset.theme = theme;
        if (['night', 'cosmos', 'neon', 'midnight', 'lava'].indexOf(theme) >= 0) document.documentElement.dataset.dark = '1';
      } catch (e) {}
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="scene" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="topbar" id="topbar"></header>
    <main id="app" class="app"></main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    <noscript><p class="noscript">Для работы Prep&amp;Play нужен включённый JavaScript.</p></noscript>
  </body>
</html>
